spring:
  application:
    name: backup-server

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/novelstudio}
    username: ${DB_USER:novelstudio}
    password: ${DB_PASSWORD:novelstudio}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: false

jwt:
  secret: ${JWT_SECRET:change-this-to-a-very-long-random-string-at-least-32-chars}
  access-token-expiry: 7200000    # 2 hours
  refresh-token-expiry: 604800000 # 7 days

storage:
  path: ${STORAGE_PATH:./data/backups}
  max-size-mb: 500

logging:
  level:
    com.ainovelstudio.backup: INFO
    org.springframework.security: WARN
