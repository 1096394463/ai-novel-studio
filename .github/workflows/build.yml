name: Build AI Novel Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            jre_platform: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            jre_platform: mac-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            jre_platform: mac-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            jre_platform: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev file fuse libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Build backend
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Prepare backend resources
        run: |
          mkdir -p frontend/src-tauri/backend
          cp backend/target/novel-studio-backend-*.jar frontend/src-tauri/backend/novel-studio-backend.jar

      - name: Download and bundle JRE
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/backend/jre

          download_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in 1 2 3; do
              echo "Download attempt $attempt: $url"
              curl -L --retry 3 --retry-delay 5 -o "$output" "$url"
              # Verify file is > 1MB (not an error page)
              if [ -f "$output" ] && [ $(stat -c%s "$output" 2>/dev/null || stat -f%z "$output" 2>/dev/null || echo 0) -gt 1000000 ]; then
                echo "Download successful ($(stat -c%s "$output" 2>/dev/null || stat -f%z "$output") bytes)"
                return 0
              fi
              echo "Download failed or too small, retrying..."
              sleep 10
            done
            echo "ERROR: Failed to download JRE after 3 attempts"
            exit 1
          }

          if [ "${{ matrix.jre_platform }}" = "windows-x64" ]; then
            download_with_retry "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse" "jre.zip"
            7z x jre.zip -ojre_extract
            mv jre_extract/jdk-21*/* frontend/src-tauri/backend/jre/
          elif [ "${{ matrix.jre_platform }}" = "mac-aarch64" ]; then
            download_with_retry "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jre/hotspot/normal/eclipse" "jre.tar.gz"
            tar xzf jre.tar.gz
            mv jdk-21*/Contents/Home/* frontend/src-tauri/backend/jre/
          elif [ "${{ matrix.jre_platform }}" = "mac-x64" ]; then
            download_with_retry "https://api.adoptium.net/v3/binary/latest/21/ga/mac/x64/jre/hotspot/normal/eclipse" "jre.tar.gz"
            tar xzf jre.tar.gz
            mv jdk-21*/Contents/Home/* frontend/src-tauri/backend/jre/
          else
            download_with_retry "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse" "jre.tar.gz"
            tar xzf jre.tar.gz
            mv jdk-21*-jre/* frontend/src-tauri/backend/jre/
          fi

          echo "JRE bundled successfully"
          ls frontend/src-tauri/backend/jre/bin/ | head -5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Novel Studio ${{ github.ref_name }}"
          releaseBody: "Download AI Novel Studio for your platform."
          releaseDraft: true
          args: "--target ${{ matrix.target }}"
