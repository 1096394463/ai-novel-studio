name: Build AI Novel Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            jre_platform: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            jre_platform: mac-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            jre_platform: mac-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            jre_platform: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev file fuse libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Build backend
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Prepare backend resources
        run: |
          mkdir -p frontend/src-tauri/backend
          cp backend/target/novel-studio-backend-*.jar frontend/src-tauri/backend/novel-studio-backend.jar

      - name: Bundle JRE from setup-java
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/backend/jre
          echo "JAVA_HOME=$JAVA_HOME"
          # Copy the installed JDK as bundled JRE
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -r "$JAVA_HOME"/* frontend/src-tauri/backend/jre/
          else
            cp -r "$JAVA_HOME"/* frontend/src-tauri/backend/jre/
          fi
          echo "JRE bundled successfully"
          ls frontend/src-tauri/backend/jre/bin/ | head -5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Novel Studio ${{ github.ref_name }}"
          releaseBody: "Download AI Novel Studio for your platform."
          releaseDraft: true
          args: "--target ${{ matrix.target }}"
