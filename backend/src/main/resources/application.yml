server:
  port: ${SERVER_PORT:18080}
  address: 127.0.0.1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:desktop}
  datasource:
    url: jdbc:sqlite:${DATA_DIR:./data}/novel-studio.db
    driver-class-name: org.sqlite.JDBC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ainovelstudio.novelstudio.model
  configuration:
    map-underscore-to-camel-case: true

# AI Configuration
ai:
  model: gpt-4
  api-key: ${AI_API_KEY:}
  context:
    window-size: 6
    include-graph: true
    include-map: true

# Logging
logging:
  level:
    com.ainovelstudio.novelstudio: DEBUG
    org.sqlite: WARN
    org.springframework.boot: INFO
    org.springframework.web: INFO
  file:
    name: ${LOGGING_FILE_NAME:./data/novel-studio.log}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
